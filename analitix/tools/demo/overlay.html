<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>Analitix</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:720px; overflow:hidden; position:relative;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
         background:#000; color:#f2f4f8; }
  #plate { position:absolute; inset:0; background-size:cover; background-position:center; }
  #vig { position:absolute; inset:0; background:
        linear-gradient(180deg, rgba(8,11,18,.55) 0%, rgba(8,11,18,0) 22%,
                        rgba(8,11,18,0) 62%, rgba(8,11,18,.78) 100%); }

  .stamp { position:absolute; right:18px; top:16px; font-size:10.5px; font-weight:700;
           letter-spacing:.18em; text-transform:uppercase; color:rgba(242,244,248,.62);
           background:rgba(8,11,18,.5); padding:5px 11px; border-radius:999px;
           backdrop-filter:blur(4px); }

  h1 { position:absolute; left:34px; top:26px; font-size:26px; font-weight:800;
       letter-spacing:-.4px; text-shadow:0 2px 14px rgba(0,0,0,.8); }
  .sub { position:absolute; left:34px; top:62px; font-size:15px; color:#c8d0de;
         text-shadow:0 2px 12px rgba(0,0,0,.85); }

  /* detector overlay */
  .box { position:absolute; border:2px solid #38d39f; border-radius:3px;
         box-shadow:0 0 0 1px rgba(0,0,0,.45), 0 0 22px rgba(56,211,159,.35);
         opacity:0; transform:scale(1.06); transition:opacity .35s, transform .35s; }
  .box.on { opacity:1; transform:scale(1); }
  .box b { position:absolute; left:-2px; top:-24px; background:#38d39f; color:#062018;
           font-size:11px; font-weight:800; letter-spacing:.06em; padding:3px 8px;
           border-radius:3px; white-space:nowrap; }
  .box.warn { border-color:#f0a637; box-shadow:0 0 0 1px rgba(0,0,0,.45), 0 0 22px rgba(240,166,55,.4); }
  .box.warn b { background:#f0a637; color:#241802; }

  #line { position:absolute; height:3px; background:#c9a227; opacity:0;
          box-shadow:0 0 16px rgba(201,162,39,.9); transition:opacity .5s; }
  #line.on { opacity:1; }
  #line.hit { animation:hit .6s ease-out; }
  @keyframes hit { 0% { box-shadow:0 0 40px 8px rgba(201,162,39,1); } 100% {} }
  #linelbl { position:absolute; font-size:11px; font-weight:800; letter-spacing:.14em;
             text-transform:uppercase; color:#e2cf94; opacity:0; transition:opacity .5s;
             text-shadow:0 2px 10px rgba(0,0,0,.9); }
  #linelbl.on { opacity:1; }

  /* the HUD */
  .hud { position:absolute; background:rgba(12,16,26,.82); border:1px solid rgba(255,255,255,.1);
         border-radius:12px; padding:16px 20px; backdrop-filter:blur(9px);
         opacity:0; transform:translateY(10px); transition:opacity .5s, transform .5s; }
  .hud.on { opacity:1; transform:none; }
  .hud h2 { font-size:10px; letter-spacing:.2em; text-transform:uppercase;
            color:#8b96ab; font-weight:800; margin-bottom:10px; }
  .hud .big { font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .hud .rows { display:flex; gap:26px; }
  .hud .rows span { display:block; font-size:10px; letter-spacing:.12em;
                    text-transform:uppercase; color:#8b96ab; margin-top:5px; }
  .flash { animation:pop .4s ease-out; }
  @keyframes pop { 0% { transform:scale(1.3); } 100% { transform:scale(1); } }
  .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px;
          line-height:1.85; color:#38d39f; }

  /* face sequence */
  #wipe { position:absolute; inset:0; background:#080b12; opacity:0;
          transition:opacity .8s; display:flex; align-items:center;
          justify-content:center; flex-direction:column; }
  #wipe.on { opacity:1; }
  #wipe .x { font-size:70px; color:#f0713f; line-height:1; }
  #wipe .t { font-size:20px; font-weight:800; margin-top:18px; letter-spacing:.02em; }
  #wipe .s { font-size:15px; color:#8b96ab; margin-top:10px; }

  /* phone */
  #phone { position:absolute; right:36px; top:96px; width:290px;
           background:rgba(12,16,26,.9); border:1px solid rgba(255,255,255,.12);
           border-radius:16px; padding:16px 18px; backdrop-filter:blur(10px);
           opacity:0; transform:translateX(18px); transition:opacity .55s, transform .55s; }
  #phone.on { opacity:1; transform:none; }
  #phone .who { font-size:10px; letter-spacing:.18em; text-transform:uppercase;
                color:#c9a227; font-weight:800; margin-bottom:9px; }
  #phone .txt { font-size:14.5px; line-height:1.5; }
  #phone .when { font-size:11.5px; color:#8b96ab; margin-top:11px; }

  .foot { position:absolute; left:34px; bottom:24px; font-size:14px; color:#c8d0de;
          text-shadow:0 2px 12px rgba(0,0,0,.9); }

  /* callout chips, used by the scenes that explain hardware rather than
     show the detector working */
  .chip { position:absolute; background:rgba(12,16,26,.88); border:1px solid rgba(255,255,255,.14);
          border-left:3px solid #c9a227; border-radius:10px; padding:12px 16px;
          max-width:330px; backdrop-filter:blur(9px); opacity:0;
          transform:translateY(9px); transition:opacity .5s, transform .5s; }
  .chip.on { opacity:1; transform:none; }
  .chip .k { font-size:10px; letter-spacing:.18em; text-transform:uppercase;
             color:#c9a227; font-weight:800; margin-bottom:7px; }
  .chip .v { font-size:14px; line-height:1.45; }
  .chip.ok { border-left-color:#38d39f; } .chip.ok .k { color:#38d39f; }
  .chip.warn { border-left-color:#f0a637; } .chip.warn .k { color:#f0a637; }

  /* zones are quadrilaterals on a floor seen in perspective */
  #zones { position:absolute; inset:0; }
  #zones polygon { fill:rgba(201,162,39,.17); stroke:#c9a227; stroke-width:2.5;
                   stroke-dasharray:10 7; opacity:0; transition:opacity .6s;
                   filter:drop-shadow(0 0 10px rgba(0,0,0,.55)); }
  #zones polygon.on { opacity:1; }
  .zlbl { position:absolute; font-size:11px; font-weight:800; letter-spacing:.08em;
          background:#c9a227; color:#241802; padding:3px 9px; border-radius:3px;
          white-space:nowrap; opacity:0; transition:opacity .5s; }
  .zlbl.on { opacity:1; }
  .zlbl em { font-style:normal; opacity:.72; font-weight:700; }

  .plan { position:absolute; right:18px; top:52px; font-size:10.5px; font-weight:800;
          letter-spacing:.16em; text-transform:uppercase; color:#062018;
          background:#38d39f; padding:5px 11px; border-radius:999px; }

  /* a blank screen in the plate, painted with what the rule put on it */
  .scr { position:absolute; background:#0b1220; border-radius:3px; overflow:hidden;
         opacity:0; transition:opacity .6s; display:flex; flex-direction:column;
         align-items:center; justify-content:center; text-align:center;
         box-shadow:0 0 34px rgba(90,140,255,.28); padding:14px; }
  .scr.on { opacity:1; }
  .scr .k { font-size:11px; letter-spacing:.2em; text-transform:uppercase;
            color:#c9a227; font-weight:800; margin-bottom:9px; }
  .scr .m { font-size:20px; font-weight:700; line-height:1.35; color:#f2f4f8; }
  .scr .m em { font-style:normal; color:#c9a227; }
  .scr.dim { background:rgba(11,18,32,.55); box-shadow:none; }
  .scr.dim .m { font-size:13px; color:#8b96ab; font-weight:600; }
</style></head>
<body>
  <div id="plate"></div><div id="vig"></div>
  <div class="stamp" id="stamp">Illustration</div>
  <h1 id="title"></h1><div class="sub" id="sub"></div>
  <div id="line"></div><div id="linelbl">virtual line</div>
  <div id="wipe"><div class="x">✕</div><div class="t">Frame destroyed</div>
       <div class="s">never written to disk · never queued · never sent</div></div>
  <div id="phone"><div class="who">Analitix</div>
       <div class="txt" id="ptxt"></div><div class="when">now · only you were told</div></div>
  <div class="foot" id="foot"></div>

<script>
const q = new URLSearchParams(location.search);
const scene = q.get("s") || "door";
const $ = id => document.getElementById(id);
// Spanish for everything the overlay draws. The listing on apps.odoo.com is in
// English; xubax.com is not, and an English headline burnt into the picture on
// a Spanish page reads like a stock image. Keys are the exact source strings.
const LANG = q.get("lang") || "en";
const DICT = {
  "virtual line": "línea virtual",
  "Illustration": "Ilustración",
  "now · only you were told": "ahora · solo a ti te llegó",
  "Actions plan": "Plan Acciones",
  // door
  "t-4470 · IN": "t-4470 · ENTRA",
  "t-4468 · staff — not counted": "t-4468 · personal — no se cuenta",
  "This hour": "Esta hora", "in": "entran", "out": "salen", "inside": "adentro",
  // floor
  "NECKLACES": "COLLARES", "TILL": "CAJA", "WATCHES": "RELOJES",
  "BANGLES": "PULSERAS",
  "median 3:10": "mediana 3:10", "median 1:05": "mediana 1:05",
  "median 2:40": "mediana 2:40", "median 4:20": "mediana 4:20",
  // frustrated
  "expression · negative": "expresión · negativa",
  "Held, not a glance": "Sostenida, no una mirada",
  "38 of the last 60 seconds read negative. One frown is nothing; this is not one frown.":
    "38 de los últimos 60 segundos leen negativo. Un gesto no es nada; esto no es un gesto.",
  // walkout
  "t-9102 · OUT · 9 min inside, no ticket":
    "t-9102 · SALE · 9 min adentro, sin ticket",
  "t-9098 · matched to a ticket": "t-9098 · ligada a un ticket",
  "Today, this shop": "Hoy, esta tienda",
  "visitors": "visitantes", "tickets": "tickets", "conversion": "conversión",
  // install
  "This is the whole system": "Esto es todo el sistema",
  "A fanless mini-PC, no graphics card. One per shop, however many cameras it has.":
    "Una mini PC sin ventilador, sin tarjeta de video. Una por tienda, tenga las cámaras que tenga.",
  "Your own router": "Tu propio router",
  "Its only outbound traffic is numbers, to your own Odoo. There is no endpoint that would take a frame.":
    "Lo único que sale son números, hacia tu propio Odoo. No existe un punto que acepte una imagen.",
  // cameras
  "Analogue · already on the wall": "Análoga · ya está en la pared",
  "The old coax camera plus a USB capture stick, about $20. Nothing gets rewired.":
    "La cámara vieja de coaxial más una capturadora USB de unos $400. No se recablea nada.",
  "USB webcam": "Webcam USB",
  "The cheapest way to try a second door before buying anything.":
    "La forma más barata de probar una segunda puerta antes de comprar nada.",
  "IP camera · RTSP": "Cámara IP · RTSP",
  "Give it the stream URL. Reconnects on its own when the network blinks.":
    "Le das la URL del stream. Se reconecta sola cuando la red parpadea.",
  // blind
  "Device": "Equipo",
  "Online · last heartbeat 6 s ago": "En línea · último latido hace 6 s",
  "Crossings, last 45 minutes": "Cruces, últimos 45 minutos",
  "<b style='font-size:26px'>0</b><br/>Usual for a Saturday at 13:00: <b>38</b>":
    "<b style='font-size:26px'>0</b><br/>Lo normal un sábado a las 13:00: <b>38</b>",
  "Scheduled in Odoo, for the shop manager": "Agendado en Odoo, para el encargado",
  "Door camera at Anello Centro is still connected but has stopped seeing. Check the lens and where it is pointing.":
    "La cámara de la puerta sigue conectada pero dejó de ver. Revisa el lente y hacia dónde apunta.",
  // window
  "WINDOW SHOWCASE": "APARADOR", "8 pieces on it": "8 piezas en él",
  "purchase unit of 2 · stopped 1:40": "unidad de compra de 2 · parada 1:40",
  "t-2214 · passed, no stop": "t-2214 · pasó, no se detuvo",
  "Window Showcase · today": "Aparador · hoy",
  "stops": "paradas", "avg stop": "parada media", "tickets from it": "tickets de él",
  // screens
  "SCREEN A · zone: Necklaces": "PANTALLA A · zona: Collares",
  "SCREEN B · faces the entrance": "PANTALLA B · da a la entrada",
  "Chosen": "Elegida",
  "The pair she is looking at, <em>in her size</em>":
    "El par que está viendo, <em>en su talla</em>",
  "not this rule — different job, different zone":
    "esta regla no — otro trabajo, otra zona",
  "The rule that fired": "La regla que se disparó",
  "Somebody stopped at <b>Necklaces</b> \u2192 the screen <b>in that zone</b>. Destination first, content second.":
    "Alguien se detuvo en <b>Collares</b> \u2192 la pantalla <b>de esa zona</b>. Primero el destino, después el contenido.",
  // welcome
  "t-5501 · recognised · opted in": "t-5501 · reconocida · dio su permiso",
  "Boutique Centro": "Boutique Centro",
  "Welcome back, <em>Ana</em> \u2014 the pair you asked about came in on Tuesday":
    "Qué bueno verte, <em>Ana</em> \u2014 el par que preguntaste llegó el martes",
  "Three sources, or it reads like automation":
    "Tres fuentes, o suena a automatización",
  "An open CRM opportunity · what she has actually bought before · what she is doing right now.":
    "Una oportunidad abierta en CRM · lo que sí ha comprado antes · lo que está haciendo ahora.",
  "The social privacy rule": "La regla de privacidad social",
  "She is alone, so it shows. Walk in with somebody and the name is dropped \u2014 a greeting is not worth outing a customer.":
    "Viene sola, así que se muestra. Si entra acompañada el nombre se quita \u2014 un saludo no vale exponer a un cliente.",
  // staffdoor
  "staff \u00b7 not a visitor": "personal \u00b7 no es visitante",
  "What Odoo gets": "Lo que recibe Odoo",
  "<b>hr.attendance</b> \u2014 Rosa M., check-in 09:02, staff door. Odoo's own register, not a parallel one.":
    "<b>hr.attendance</b> \u2014 Rosa M., entrada 09:02, puerta de personal. El registro propio de Odoo, no uno paralelo.",
  "Why it ships switched off": "Por qué viene apagado",
  "A shop that has not agreed this with its team should not start recording their hours because a camera was installed.":
    "Una tienda que no lo acordó con su equipo no debería empezar a registrar sus horas porque instalaron una cámara.",
  // closing
  "Inside, according to the counter": "Adentro, según el contador",
  "<b style='font-size:30px'>1</b><br/>Shop closed 47 minutes ago.":
    "<b style='font-size:30px'>1</b><br/>La tienda cerró hace 47 minutos.",
  "The visit that never closed": "La visita que nunca cerró",
  "<b>t-7734</b> open since 11:18 \u2014 6h 02m, no exit recorded. The behaviour scan only looks at the last hour, so nothing else would have found it.":
    "<b>t-7734</b> abierta desde las 11:18 \u2014 6h 02m, sin salida registrada. El barrido de comportamiento solo mira la última hora, así que nada más la habría encontrado.",
  // group
  "Purchase unit u-318": "Unidad de compra u-318",
  "people": "personas", "decision": "decisión",
  "Four minutes later": "Cuatro minutos después",
  "The same unit is in <b>three different zones</b>. That is the shape worth a quiet look \u2014 and it is also just what three friends shopping look like.":
    "La misma unidad está en <b>tres zonas distintas</b>. Esa es la forma que amerita una mirada discreta \u2014 y también es justo como se ven tres amigos de compras.",
};

const PHONE_ES = {
  zone: "Alguien lleva <b>4 minutos</b> en Anillos de Compromiso y nadie se ha acercado. Vale la pena ir.",
  frustrated: "Alguien en <b>Pulseras</b> lleva rato esperando y no se ve contenta. Vale la pena ir.",
  closing: "O hay alguien todavía en la tienda, o no se vio la salida y el aforo va inflado. Las dos cosas valen treinta segundos.",
};

function T(text) {
  if (LANG !== "es" || text == null) return text;
  return DICT[text] !== undefined ? DICT[text] : text;
}


// ?bare=1 drops the headline, the subtitle and the footnote, leaving only the
// overlay itself — for places that supply their own caption, like a card grid.
if (LANG === "es") {
  $("linelbl").textContent = T("virtual line");
  $("stamp").textContent = T("Illustration");
  document.querySelector("#phone .when").textContent = T("now · only you were told");
}
if (q.get("bare")) {
  const style = document.createElement("style");
  style.textContent = "h1,.sub,.foot{display:none!important}";
  document.head.appendChild(style);
}

const plate = $("plate");
plate.style.backgroundImage = "url('crop/" + scene + ".jpg')";

function box({x, y, w, h, label, warn, at, below, right}) {
  const el = document.createElement("div");
  el.className = "box" + (warn ? " warn" : "");
  el.style.cssText += `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  if (label) {
    el.innerHTML = "<b>" + T(label) + "</b>";
    // A label above a box that starts near the top of the frame is either
    // clipped or lands on the headline. Tuck it inside instead.
    const tag = el.querySelector("b");
    if (below) tag.style.top = (h + 4) + "px";
    else if (y < 140) tag.style.top = "4px";
    // A box against the right edge would push its label off the frame.
    if (right) { tag.style.left = "auto"; tag.style.right = "-2px"; }
  }
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("on"), at);
  return el;
}
function hud(html, css, at) {
  const el = document.createElement("div");
  el.className = "hud"; el.style.cssText += css;
  el.innerHTML = html.replace(/>([^<>]+)</g, (m, t) => ">" + T(t.trim()) + "<");
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("on"), at);
  return el;
}


function chip(kind, key, value, css, at) {
  const el = document.createElement("div");
  el.className = "chip" + (kind ? " " + kind : "");
  el.style.cssText += css;
  el.innerHTML = '<div class="k">' + T(key) + '</div><div class="v">' + T(value) + '</div>';
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("on"), at);
  return el;
}
function zone(points, label, note, lx, ly, at) {
  let svg = document.getElementById("zones");
  if (!svg) {
    svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.id = "zones"; svg.setAttribute("viewBox", "0 0 1280 720");
    document.body.appendChild(svg);
  }
  const el = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  el.setAttribute("points", points);
  svg.appendChild(el);
  const lb = document.createElement("div");
  lb.className = "zlbl";
  lb.style.cssText += `left:${lx}px;top:${ly}px`;
  lb.innerHTML = T(label) + (note ? ' <em>· ' + T(note) + '</em>' : '');
  document.body.appendChild(lb);
  setTimeout(() => { el.classList.add("on"); lb.classList.add("on"); }, at);
}

function screen(x, y, w, h, key, message, dim, at) {
  const el = document.createElement("div");
  el.className = "scr" + (dim ? " dim" : "");
  el.style.cssText += `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  el.innerHTML = (key ? '<div class="k">' + T(key) + "</div>" : "") +
                 '<div class="m">' + T(message) + "</div>";
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("on"), at);
  return el;
}

// Some plates have their subject exactly where the headline normally sits.
function titleAt(top) {
  $("title").style.top = top + "px";
  $("sub").style.top = (top + 36) + "px";
}
function plan(text) {
  const el = document.createElement("div");
  el.className = "plan"; el.textContent = T(text);
  document.body.appendChild(el);
}

if (scene === "door") {
  $("title").textContent = "Counting at the door";
  $("sub").textContent = "A line across the doorway. Which way you cross it is what counts.";
  $("foot").textContent = "The overlay is what Analitix does. No image ever leaves the shop.";
  const L = $("line");
  L.style.cssText += "left:388px;top:152px;width:445px";
  $("linelbl").style.cssText += "left:842px;top:144px";
  setTimeout(() => { L.classList.add("on"); $("linelbl").classList.add("on"); }, 500);

  box({x:437, y:0,   w:130, h:122, label:"t-4471",           at:1100});
  box({x:632, y:0,   w:132, h:150, label:"t-4472",           at:1500});
  box({x:533, y:95,  w:136, h:200, label:"t-4470 · IN",      at:2100});
  box({x:540, y:425, w:222, h:250, label:"t-4468 · staff — not counted", warn:true, at:3000});

  const panel = hud(
    '<h2>This hour</h2><div class="rows">' +
    '<div><div class="big" id="cin" style="color:#38d39f">61</div><span>in</span></div>' +
    '<div><div class="big" id="cout" style="color:#f0a637">44</div><span>out</span></div>' +
    '<div><div class="big" style="color:#c9a227">17</div><span>inside</span></div></div>',
    "right:36px;bottom:34px", 1800);
  setTimeout(() => {
    $("line").classList.add("hit");
    const c = $("cin"); c.textContent = "62"; c.classList.add("flash");
  }, 2400);
  setTimeout(() => {
    const c = $("cin"); c.textContent = "63"; c.classList.remove("flash");
    void c.offsetWidth; c.classList.add("flash"); $("line").classList.remove("hit");
    void $("line").offsetWidth; $("line").classList.add("hit");
  }, 4200);
}

if (scene === "face") {
  $("title").textContent = "What happens to a face";
  $("sub").textContent = "Read at the entrance, turned into numbers, matched on this machine — and then gone.";
  $("foot").textContent = "There is no endpoint that would accept an image. It is not a setting.";
  box({x:474, y:48, w:146, h:196, label:"face · 0.94", below:true, at:900});
  hud('<h2>Turned into numbers</h2><div class="code">[ 0.118, −0.442, 0.907,<br/>&nbsp;&nbsp;0.031, −0.765, … ]<br/>512 values · irreversible</div>',
      "left:34px;bottom:120px;width:300px", 2200);
  hud('<h2>Matched here</h2><div class="code">staff? &nbsp;no<br/>seen before? &nbsp;14:02<br/>→ one visit, not two</div>',
      "left:352px;bottom:120px;width:270px", 3600);
  setTimeout(() => $("wipe").classList.add("on"), 5600);
}

if (scene === "zone") {
  $("title").textContent = "The sale that was about to walk out";
  $("sub").textContent = "Long enough, nobody served them, no ticket. All three — each alone is ordinary.";
  $("foot").textContent = "One salesperson is nudged. The customer never knows.";
  box({x:255, y:96, w:400, h:624, label:"t-8841 · Engagement Rings", at:900});
  const t = hud('<h2>Dwell</h2><div class="big" id="clock" style="color:#f0a637">0:15</div>' +
                '<span style="display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8b96ab;margin-top:5px">unserved</span>',
                "left:34px;bottom:120px", 1600);
  let s = 15;
  const tick = setInterval(() => {
    s += 15;
    $("clock").textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
    if (s >= 240) {
      clearInterval(tick);
      $("ptxt").innerHTML = LANG === "es" ? PHONE_ES[scene] : "Someone has been at <b>Engagement Rings</b> for 4 minutes and nobody has been over. Worth a look.";
      $("phone").classList.add("on");
    }
  }, 380);
}

if (scene === "install") {
  $("title").textContent = "What actually gets installed";
  $("sub").textContent = "One small computer in the back room. Nothing on the till, nothing in the cloud.";
  $("foot").textContent = "If the line drops it keeps counting and sends the backlog when it comes back.";
  chip("ok", "This is the whole system",
       "A fanless mini-PC, no graphics card. One per shop, however many cameras it has.",
       "left:34px;bottom:130px", 900);
  chip("", "Your own router",
       "Its only outbound traffic is numbers, to your own Odoo. There is no endpoint that would take a frame.",
       "right:34px;bottom:130px", 2000);
  box({x:572, y:300, w:305, h:158, at:600});
}

if (scene === "cameras") {
  $("title").textContent = "Cameras you probably already have";
  $("sub").textContent = "Analogue, USB or IP — the agent opens all three the same way.";
  $("foot").textContent = "One computer handles several at once. What it never does is send a frame anywhere.";
  chip("ok", "Analogue · already on the wall",
       "The old coax camera plus a USB capture stick, about $20. Nothing gets rewired.",
       "left:26px;bottom:64px;max-width:300px", 900);
  chip("ok", "USB webcam",
       "The cheapest way to try a second door before buying anything.",
       "left:352px;bottom:64px;max-width:270px", 1700);
  chip("ok", "IP camera · RTSP",
       "Give it the stream URL. Reconnects on its own when the network blinks.",
       "right:26px;bottom:64px;max-width:300px", 2500);
}

if (scene === "blind") {
  $("title").textContent = "The camera that is online and blind";
  $("sub").textContent = "Somebody left a display under the lens. The device never stopped reporting.";
  $("foot").textContent = "An outage is obvious. This is the one that quietly costs you a month of data.";
  chip("ok", "Device", "Online · last heartbeat 6 s ago", "left:34px;top:130px;max-width:280px", 700);
  chip("warn", "Crossings, last 45 minutes",
       "<b style=\'font-size:26px\'>0</b><br/>Usual for a Saturday at 13:00: <b>38</b>",
       "left:34px;top:250px;max-width:280px", 1700);
  chip("warn", "Scheduled in Odoo, for the shop manager",
       "Door camera at Anello Centro is still connected but has stopped seeing. Check the lens and where it is pointing.",
       "right:34px;top:130px;max-width:330px", 3000);
}

if (scene === "floor") {
  $("title").textContent = "Zones are just parts of your floor";
  $("sub").textContent = "Draw them once. After that, time spent and whether anyone came over is measured per zone.";
  $("foot").textContent = "No zone, no measurement. The shop decides what is worth watching.";
  zone("566,172 672,215 250,720 62,720", "NECKLACES", "median 3:10", 300, 300, 900);
  zone("578,108 872,108 872,252 578,252", "TILL", "median 1:05", 596, 118, 1600);
  zone("886,148 1244,148 1244,272 886,272", "WATCHES", "median 2:40", 900, 158, 2200);
  zone("1026,340 1280,340 1280,720 1076,720", "BANGLES", "median 4:20", 1040, 350, 2800);
}

if (scene === "walkout") {
  $("title").textContent = "A walk-out stops being a mystery";
  $("sub").textContent = "Someone came in, stayed nine minutes and left with nothing. That is a number you can work with.";
  $("foot").textContent = "Conversion is visitors against tickets, same hour, same shop — not a guess.";
  box({x:78, y:100, w:252, h:615, label:"t-9102 · OUT · 9 min inside, no ticket", warn:true, at:900});
  box({x:1118, y:128, w:160, h:440, label:"t-9098 · matched to a ticket", below:true, right:true, at:2000});
  hud('<h2>Today, this shop</h2><div class="rows">' +
      '<div><div class="big" style="color:#c9a227">41</div><span>visitors</span></div>' +
      '<div><div class="big" style="color:#38d39f">12</div><span>tickets</span></div>' +
      '<div><div class="big" style="color:#f0a637">29%</div><span>conversion</span></div></div>',
      "left:34px;bottom:64px", 3000);
}

if (scene === "frustrated") {
  plan("Complete plan");
  $("title").textContent = "When waiting turns into leaving";
  $("sub").textContent = "A negative expression that holds, next to nobody serving, is the minute before a walk-out.";
  $("foot").textContent = "The expression dies with the frame. What is kept is the word, the zone and the time.";
  box({x:543, y:18, w:158, h:176, label:"expression · negative", warn:true, below:true, at:900});
  chip("warn", "Held, not a glance",
       "38 of the last 60 seconds read negative. One frown is nothing; this is not one frown.",
       "left:34px;bottom:200px;max-width:300px", 2200);
  setTimeout(() => {
    $("ptxt").innerHTML = LANG === "es" ? PHONE_ES[scene] : "Someone at <b>Bangles</b> has been waiting a while and looks unhappy about it. Worth going over.";
    $("phone").classList.add("on");
  }, 3600);
}


if (scene === "window") {
  $("title").textContent = "Displays: what they stop in front of";
  $("sub").textContent = "Zones say where people go. A display says what they stop at — and it is never reported alone.";
  $("foot").textContent = "Attention on its own is a vanity metric. Crossed with the sales of the pieces on it, it is a decision.";
  zone("0,38 548,64 548,508 0,474", "WINDOW SHOWCASE", "8 pieces on it", 26, 104, 700);
  box({x:516, y:120, w:312, h:600, label:"purchase unit of 2 · stopped 1:40", at:1500});
  box({x:938, y:172, w:198, h:548, label:"t-2214 · passed, no stop", warn:true, at:2400});
  hud('<h2>Window Showcase · today</h2><div class="rows">' +
      '<div><div class="big" style="color:#c9a227">34</div><span>stops</span></div>' +
      '<div><div class="big" style="color:#38d39f">1:12</div><span>avg stop</span></div>' +
      '<div><div class="big" style="color:#f0a637">2</div><span>tickets from it</span></div></div>',
      "right:34px;bottom:64px", 3200);
}

if (scene === "screens") {
  $("title").textContent = "A message to \u201cthe screen\u201d goes to the wrong screen";
  $("sub").textContent = "Every rule resolves where before what. The destination comes from the zone it happened in.";
  $("foot").textContent = "The one over the counter, the one at the exit and the one facing the street do different jobs.";
  titleAt(398);
  box({x:28, y:22, w:280, h:172, label:"SCREEN A · zone: Necklaces", at:900});
  screen(34, 28, 268, 160, "Chosen",
         "The pair she is looking at, <em>in her size</em>", false, 1700);
  box({x:726, y:144, w:298, h:180, label:"SCREEN B · faces the entrance", warn:true, at:2400});
  screen(732, 150, 286, 168, "", "not this rule — different job, different zone", true, 2600);
  chip("ok", "The rule that fired",
       "Somebody stopped at <b>Necklaces</b> \u2192 the screen <b>in that zone</b>. Destination first, content second.",
       "right:34px;bottom:64px;max-width:330px", 3400);
}

if (scene === "welcome") {
  plan("Actions plan");
  $("title").textContent = "A welcome that is not a mail merge";
  $("sub").textContent = "Assembled from an open opportunity, what they actually bought, and this visit.";
  $("foot").textContent = "Off by default, opt-in per customer, and every read of that data is audited.";
  box({x:298, y:138, w:362, h:582, label:"t-5501 · recognised · opted in", at:900});
  screen(648, 88, 438, 244, "Boutique Centro",
         "Welcome back, <em>Ana</em> \u2014 the pair you asked about came in on Tuesday", false, 1900);
  chip("ok", "Three sources, or it reads like automation",
       "An open CRM opportunity · what she has actually bought before · what she is doing right now.",
       "left:34px;bottom:64px;max-width:320px", 3000);
  chip("warn", "The social privacy rule",
       "She is alone, so it shows. Walk in with somebody and the name is dropped \u2014 a greeting is not worth outing a customer.",
       "right:34px;bottom:64px;max-width:320px", 3800);
}

if (scene === "staffdoor") {
  plan("Actions plan");
  $("title").textContent = "Attendance, off by default";
  $("sub").textContent = "The signatures that keep staff out of the visitor count already know who walked in, and when.";
  $("foot").textContent = "Nearly free to build. Not free to decide — so the shop decides, not the camera.";
  box({x:498, y:20, w:330, h:700, label:"staff \u00b7 not a visitor", warn:true, at:900});
  chip("ok", "What Odoo gets",
       "<b>hr.attendance</b> \u2014 Rosa M., check-in 09:02, staff door. Odoo's own register, not a parallel one.",
       "left:34px;bottom:64px;max-width:310px", 2000);
  chip("warn", "Why it ships switched off",
       "A shop that has not agreed this with its team should not start recording their hours because a camera was installed.",
       "right:34px;bottom:64px;max-width:310px", 3000);
}

if (scene === "closing") {
  $("title").textContent = "Entered, never left";
  $("sub").textContent = "The one signal the other three structurally cannot see.";
  $("foot").textContent = "Usually a missed exit \u2014 which still matters, because it inflates every occupancy figure after it.";
  chip("warn", "Inside, according to the counter",
       "<b style=\'font-size:30px\'>1</b><br/>Shop closed 47 minutes ago.",
       "left:34px;top:130px;max-width:290px", 800);
  chip("warn", "The visit that never closed",
       "<b>t-7734</b> open since 11:18 \u2014 6h 02m, no exit recorded. The behaviour scan only looks at the last hour, so nothing else would have found it.",
       "left:34px;top:290px;max-width:320px", 2000);
  setTimeout(() => {
    $("ptxt").innerHTML = LANG === "es" ? PHONE_ES[scene] : "Either somebody is still in the shop, or the exit was not seen and the occupancy figure is running high. Both are worth thirty seconds.";
    $("phone").classList.add("on");
  }, 3400);
}

if (scene === "group") {
  $("title").textContent = "Arrived together, then scattered";
  $("sub").textContent = "Three people and one ticket is not a 33% conversion rate. It is one buying decision.";
  $("foot").textContent = "It never says anybody is a thief. It says worth going over \u2014 the right answer either way.";
  box({x:352, y:148, w:168, h:572, label:"u-318", at:900});
  box({x:530, y:150, w:132, h:508, label:"u-318", at:1200});
  box({x:640, y:186, w:150, h:512, label:"u-318", at:1500});
  hud('<h2>Purchase unit u-318</h2><div class="rows">' +
      '<div><div class="big" style="color:#c9a227">3</div><span>people</span></div>' +
      '<div><div class="big" style="color:#38d39f">1</div><span>decision</span></div></div>',
      "right:34px;top:130px", 2200);
  chip("warn", "Four minutes later",
       "The same unit is in <b>three different zones</b>. That is the shape worth a quiet look \u2014 and it is also just what three friends shopping look like.",
       "right:34px;bottom:64px;max-width:330px", 3400);
}

</script>
