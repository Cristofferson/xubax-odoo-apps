<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>ANALITIX · íconos Odoo 19</title>
<style>
  /* La tipología no se adivinó: se midió sobre los 100 íconos del core de
     Odoo 19 que hay en este servidor.

       · 100x100 PNG con FONDO TRANSPARENTE (no hay placa ni cuadro redondeado)
       · formas planas: cero degradados, cero sombras, cero contornos
       · paleta cerrada, y el rasgo distintivo es que las formas se TRASLAPAN
         y el cruce se oscurece — de ahí salen los tonos profundos del core
         (#1A6F66, #144496, #712258) sin que nadie los pinte a mano.

     Por eso aquí el traslape es `mix-blend-mode: multiply` y no un color
     inventado: da exactamente el mismo resultado que en los íconos de Odoo. */
  * { margin:0; padding:0; }
  body { background:#f5f5f3; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  .sheet { display:flex; flex-wrap:wrap; gap:34px; padding:34px; }
  .item { text-align:center; }
  .item b { display:block; margin-top:10px; font-size:13px; color:#333; }
  svg { display:block; }
  .mul { mix-blend-mode:multiply; }
</style></head>
<body>
<div class="sheet">

  <!-- A · EL UMBRAL — las dos jambas y la línea virtual que las cruza.
       Es literalmente lo que hace el producto en la puerta. -->
  <div class="item">
    <svg id="ico-umbral" width="100" height="100" viewBox="0 0 100 100">
      <rect x="16" y="6" width="20" height="88" rx="6" fill="#985184"/>
      <rect x="64" y="6" width="20" height="88" rx="6" fill="#985184"/>
      <rect class="mul" x="4" y="42" width="92" height="18" rx="9" fill="#1AD3BB"/>
    </svg>
    <b>A · El umbral</b>
  </div>

  <!-- B · EL CRUCE — la dirección es lo que cuenta, no el paso.
       Flecha ámbar atravesando la línea. -->
  <div class="item">
    <svg id="ico-cruce" width="100" height="100" viewBox="0 0 100 100">
      <path d="M14 22 L58 50 L14 78 Z" fill="#FBB945"/>
      <rect x="60" y="22" width="20" height="56" rx="10" fill="#FBB945"/>
      <rect class="mul" x="46" y="6" width="18" height="88" rx="9" fill="#1AD3BB"/>
    </svg>
    <b>B · El cruce</b>
  </div>

  <!-- C · TRES QUE ENTRAN — cabezas vistas desde arriba cruzando la línea.
       La que ya cruzó queda oscurecida por el traslape: ésa ya se contó. -->
  <div class="item">
    <svg id="ico-gente" width="100" height="100" viewBox="0 0 100 100">
      <!-- Tres que cruzan, en diagonal: una todavía afuera, otra justo encima
           de la línea —donde el traslape la oscurece, que es el momento en que
           se cuenta— y otra ya adentro. La diagonal es lo que da movimiento; en
           la primera versión las tres estaban regadas y a 56 px se apelmazaban. -->
      <circle cx="20" cy="18" r="20" fill="#985184"/>
      <circle cx="50" cy="50" r="23" fill="#FBB945"/>
      <circle cx="80" cy="82" r="20" fill="#FC868B"/>
      <rect class="mul" x="0" y="40" width="100" height="20" rx="10" fill="#1AD3BB"/>
    </svg>
    <b>C · Tres que entran</b>
  </div>

  <!-- D · LA CONVERSIÓN — la barra ancha son los que entraron, la angosta los
       que compraron, y el traslape es la conversión. El número que el ERP no
       tiene, dibujado. -->
  <div class="item">
    <svg id="ico-conversion" width="100" height="100" viewBox="0 0 100 100">
      <rect x="6" y="14" width="88" height="30" rx="15" fill="#985184"/>
      <rect class="mul" x="24" y="56" width="52" height="30" rx="15" fill="#1AD3BB"/>
      <rect class="mul" x="6" y="14" width="30" height="72" rx="15" fill="#FBB945"/>
    </svg>
    <b>D · La conversión</b>
  </div>

  <!-- E · LA ZONA — un pedazo del piso visto en perspectiva y alguien parado
       en él. Es la otra mitad del producto: no solo cuántos, dónde. -->
  <div class="item">
    <svg id="ico-zona" width="100" height="100" viewBox="0 0 100 100">
      <path d="M30 12 L94 26 L70 90 L6 72 Z" fill="#1AD3BB"/>
      <circle class="mul" cx="46" cy="50" r="22" fill="#985184"/>
    </svg>
    <b>E · La zona</b>
  </div>

  <!-- F · EL QUE SE VA — dos flechas, una entra y otra sale sin nada.
       Es la venta perdida, que es lo que el producto realmente vende. -->
  <div class="item">
    <svg id="ico-salida" width="100" height="100" viewBox="0 0 100 100">
      <path d="M8 14 L52 14 L74 36 L52 58 L8 58 L30 36 Z" fill="#1AD3BB"/>
      <path class="mul" d="M92 86 L48 86 L26 64 L48 42 L92 42 L70 64 Z" fill="#FC868B"/>
    </svg>
    <b>F · El que se va</b>
  </div>

</div>
</body></html>
