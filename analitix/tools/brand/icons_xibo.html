<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>Xibo · íconos Odoo 19</title>
<style>
  /* Mismo lenguaje medido sobre los 100 íconos del núcleo de Odoo 19 que se
     usó para Analitix: PNG con fondo transparente (nada de placa redondeada),
     formas planas sin degradado ni contorno, paleta cerrada, y el rasgo que los
     define — las formas se traslapan y el cruce se oscurece solo.

     Los dos íconos que había hacían justo lo contrario: una placa sólida con un
     dibujo blanco encima. Al lado de cualquier app del núcleo se ven de otro
     programa, que es exactamente lo que pasaba con el de Analitix. */
  * { margin:0; padding:0; }
  body { background:#f5f5f3; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  .sheet { display:flex; gap:40px; padding:36px; }
  .item { text-align:center; }
  .item b { display:block; margin-top:10px; font-size:13px; color:#333; }
  svg { display:block; }
  .mul { mix-blend-mode:multiply; }
</style></head>
<body>
<div class="sheet">

  <!-- CONECTOR XIBO — la pantalla y lo que se le empuja.
       El bloque ciruela es la pantalla; la cuña menta que la atraviesa es el
       envío. Donde se cruzan queda el tono profundo del núcleo. -->
  <div class="item">
    <svg id="ico-xibo" width="100" height="100" viewBox="0 0 100 100">
      <rect x="8" y="16" width="84" height="56" rx="7" fill="#985184"/>
      <rect x="38" y="76" width="24" height="8" rx="4" fill="#985184"/>
      <path class="mul" d="M22 94 L74 6 L96 6 L44 94 Z" fill="#1AD3BB"/>
    </svg>
    <b>xibo_connector</b>
  </div>

  <!-- CONECTOR XIBO · PUNTO DE VENTA — el ticket que se refleja en la pantalla.
       El rectángulo ámbar de la izquierda es la venta; el ciruela de la derecha
       es la pantalla; la barra que los une es el espejo. -->
  <div class="item">
    <svg id="ico-xibopos" width="100" height="100" viewBox="0 0 100 100">
      <rect x="6" y="20" width="34" height="60" rx="6" fill="#FBB945"/>
      <rect x="54" y="14" width="40" height="48" rx="6" fill="#985184"/>
      <rect x="66" y="66" width="16" height="7" rx="3.5" fill="#985184"/>
      <rect class="mul" x="18" y="42" width="70" height="16" rx="8" fill="#1AD3BB"/>
    </svg>
    <b>xibo_connector_pos</b>
  </div>

</div>
</body></html>
